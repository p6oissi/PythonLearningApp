  - id: py-010-csv
    chapter: "3. Data Inputs"
    title: "Reading CSV Text"
    summary: "Parse the most common data format — comma-separated values."
    outcome: "You will parse a CSV string into a list of records and extract clean numeric columns."
    body_markdown: |
      Almost all data you will encounter starts life as a CSV (comma-separated values) file.
      Before using pandas, it is worth understanding what CSV really is: just structured text.

      Python's built-in `csv` module handles this safely:

      ```python
      import csv
      from io import StringIO

      csv_text = "name,score\nAda,90\nBen,81"
      reader = csv.DictReader(StringIO(csv_text))
      rows = list(reader)
      # rows = [{"name": "Ada", "score": "90"}, {"name": "Ben", "score": "81"}]
      ```

      **Key points:**
      - `StringIO` wraps a string so the csv module can read it like a file
      - `DictReader` uses the first row as column names and gives each row as a dict
      - **All values from CSV are strings** — you must convert numbers with `int()` or `float()`

      ```python
      score = int(rows[0]["score"])   # "90" → 90
      ```

      **Full pattern:**
      ```python
      names = []
      scores = []
      for row in rows:
          names.append(row["name"])
          scores.append(float(row["score"]))
      ```
    example_code: |
      import csv
      from io import StringIO

      csv_text = "city,temp_c,humidity\nOslo,8.2,72\nBergen,11.5,85\nTrondheim,6.8,68"

      rows = list(csv.DictReader(StringIO(csv_text)))
      cities = [row["city"] for row in rows]
      temps = [float(row["temp_c"]) for row in rows]

      print(f"Cities: {cities}")
      print(f"Avg temp: {round(sum(temps)/len(temps), 1)}°C")
    hints:
      - "Wrap the csv_text in StringIO before passing to DictReader: `csv.DictReader(StringIO(csv_text))`"
      - "Loop over rows to build your lists. Convert scores with `float(row['score'])` — they come in as strings."
      - "average_score = sum(scores) / len(scores). Round with round(..., 1)."
    exercise:
      prompt: |
        Parse the following CSV data:

        ```python
        csv_text = "name,score,passed\nAda,92,True\nBen,67,False\nCara,88,True\nDan,74,True"
        ```

        Create:
        - `rows` — list of dicts from DictReader
        - `names` — list of name strings
        - `scores` — list of scores as **floats**
        - `average_score` — mean score rounded to 1 decimal
        - `pass_count` — how many rows have `passed == "True"` (it comes in as a string)

        Print all five.
      starter_code: |
        import csv
        from io import StringIO

        csv_text = "name,score,passed\nAda,92,True\nBen,67,False\nCara,88,True\nDan,74,True"

        rows = []
        names = []
        scores = []
        average_score = 0
        pass_count = 0

        print(rows, names, scores, average_score, pass_count)
      success_message: "You parsed your first real-world data format. This skill is the entry point to all data work."
      tests:
        - name: "rows parsed correctly"
          assertion: "assert len(m.rows) == 4 and m.rows[0]['name'] == 'Ada'"
          hint: "rows = list(csv.DictReader(StringIO(csv_text)))"
        - name: "names extracted correctly"
          assertion: "assert m.names == ['Ada', 'Ben', 'Cara', 'Dan']"
          hint: "Loop over rows and append row['name'] to names."
        - name: "scores are floats"
          assertion: "assert m.scores == [92.0, 67.0, 88.0, 74.0]"
          hint: "Convert with float(row['score']). Order must match the original CSV."
        - name: "average_score is correct"
          assertion: "assert m.average_score == 80.2"
          hint: "round(sum(scores) / len(scores), 1) = 80.2"
        - name: "pass_count is correct"
          assertion: "assert m.pass_count == 3"
          hint: "Check `row['passed'] == 'True'` — it is a string, not a boolean, when read from CSV."

  - id: py-011-string-cleaning
    chapter: "3. Data Inputs"
    title: "Cleaning Text Data"
    summary: "Normalise messy strings before analysis — a critical preprocessing step."
    outcome: "You will clean a list of raw labels into a consistent, analysis-ready format."
    body_markdown: |
      Real-world data almost always has inconsistent text:
      extra spaces, mixed capitalisation, different spellings of the same category.
      Before any analysis, you must standardise it.

      **Common problems and fixes:**

      | Problem | Example | Fix |
      |---|---|---|
      | Extra whitespace | `"  Yes "` | `.strip()` |
      | Mixed case | `"YES"`, `"yes"` | `.lower()` |
      | Abbreviations | `"n/a"`, `"na"`, `"N/A"` | `.replace()` or explicit check |
      | Empty string | `""` | check `if value == ""` |

      **A cleaning function pattern:**
      ```python
      def clean_label(raw):
          if raw is None:
              return None
          cleaned = raw.strip().lower()
          if cleaned in ("n/a", "na", "none", ""):
              return None
          return cleaned
      ```

      **Applying to a list:**
      ```python
      raw_labels = ["  Yes ", "no", "N/A", "YES", ""]
      cleaned = [clean_label(label) for label in raw_labels]
      ```

      This one-line pattern is called a **list comprehension** — a compact way to apply a function to every item.
    example_code: |
      raw_categories = ["  A  ", "b", "C ", " a", "B", "  c"]

      cleaned = [cat.strip().upper() for cat in raw_categories]
      unique = list(set(cleaned))

      print("Cleaned:", cleaned)
      print("Unique categories:", sorted(unique))
    hints:
      - "Loop over raw_labels. For each, call .strip().lower() first. Then check if the result is in ('n/a', 'na', 'none', '')."
      - "Build clean_labels as a list. For invalid/missing values, append None. For valid ones, append the cleaned string."
      - "none_count = sum(1 for label in clean_labels if label is None). unique_labels = sorted(set(l for l in clean_labels if l is not None))"
    exercise:
      prompt: |
        Clean the following raw labels from a survey response column:

        ```python
        raw_labels = ["  Yes ", "NO", "n/a", "yes", " No ", "N/A", "YES", "", "no"]
        ```

        Create:
        - `clean_labels` — each label stripped and lowercased; `"n/a"`, `"na"`, and `""` become `None`
        - `none_count` — how many values became `None`
        - `unique_labels` — sorted list of distinct non-`None` labels

        Print all three.
      starter_code: |
        raw_labels = ["  Yes ", "NO", "n/a", "yes", " No ", "N/A", "YES", "", "no"]

        clean_labels = []
        none_count = 0
        unique_labels = []

        # Write your cleaning logic here

        print(clean_labels, none_count, unique_labels)
      success_message: "You normalised a messy categorical column. Label cleaning is step one of every classification task."
      tests:
        - name: "clean_labels are correct"
          assertion: "assert m.clean_labels == ['yes', 'no', None, 'yes', 'no', None, 'yes', None, 'no']"
          hint: "Strip then lowercase. Map 'n/a' and '' to None. 'no' and 'NO' both become 'no'."
        - name: "none_count is correct"
          assertion: "assert m.none_count == 3"
          hint: "Three values become None: 'n/a', 'N/A', and the empty string."
        - name: "unique_labels is correct"
          assertion: "assert m.unique_labels == ['no', 'yes']"
          hint: "Collect non-None values, convert to a set for uniqueness, then sort."

  # ─── Chapter 4: Reliability ──────────────────────────────────────────────────

  - id: py-012-errors
    chapter: "4. Reliability"
    title: "Errors and Debugging"
    summary: "Handle bad data without crashing — make failures visible, not silent."
    outcome: "You will safely convert a column of raw values and collect exactly the ones that failed."
    body_markdown: |
      Data pipelines fail at the messiest moment — when a user types `"missing"` where you
      expected a number, or `""` where a date should be.

      Good pipelines catch these failures explicitly so you know what went wrong and why.

      **`try / except`:**
      ```python
      try:
          number = float("3.14")   # succeeds
      except ValueError:
          number = None            # only runs if float() raised ValueError
      ```

      **Be specific about which exception you catch:**
      ```python
      try:
          result = float(raw_value)
      except ValueError:
          result = None    # bad string → not a number error
      except TypeError:
          result = None    # None or wrong type
      ```

      Catching `Exception` (all exceptions) hides bugs. Catch only what you expect.

      **Reporting failures:**
      ```python
      failed = []
      for raw in raw_values:
          try:
              numbers.append(float(raw))
          except (ValueError, TypeError):
              failed.append(raw)
      ```

      When you finish, `failed` tells you exactly what the data source sent you. That is
      information you can act on — log it, report it to the data team, or filter it out.
    example_code: |
      raw_ages = ["25", "thirty", "42", None, "19", ""]

      ages = []
      errors = []

      for raw in raw_ages:
          try:
              ages.append(int(raw))
          except (ValueError, TypeError):
              errors.append(raw)

      print(f"Parsed: {ages}")
      print(f"Failed ({len(errors)}): {errors}")
    hints:
      - "Inside the for loop, try `float(raw)`. If it raises ValueError or TypeError, catch it and add to failed_values."
      - "Wrap the conversion: `try: numbers.append(float(raw)) except (ValueError, TypeError): failed_values.append(raw)`"
      - "failure_rate = len(failed_values) / len(raw_values) — use round(..., 2) and multiply by 100 for a percentage."
    exercise:
      prompt: |
        Convert raw measurement strings to floats, tracking failures.

        ```python
        raw_values = ["10.5", "missing", "8", "", "12.25", None, "7.0", "N/A"]
        ```

        Create:
        - `numbers` — list of successfully converted floats
        - `failed_values` — list of raw values that could not be converted
        - `failure_rate` — `len(failed_values) / len(raw_values)`, rounded to 2 decimal places

        Print all three.
      starter_code: |
        raw_values = ["10.5", "missing", "8", "", "12.25", None, "7.0", "N/A"]

        numbers = []
        failed_values = []
        failure_rate = 0

        # Write your loop here

        print(numbers, failed_values, failure_rate)
      success_message: "You built a robust conversion step. Tracking failures is what separates toy code from production code."
      tests:
        - name: "numbers are correct"
          assertion: "assert m.numbers == [10.5, 8.0, 12.25, 7.0]"
          hint: "Only 4 values convert successfully: '10.5', '8', '12.25', '7.0'."
        - name: "failed_values are correct"
          assertion: "assert m.failed_values == ['missing', '', None, 'N/A']"
          hint: "The strings 'missing', '', 'N/A' and None all raise ValueError or TypeError."
        - name: "failure_rate is correct"
          assertion: "assert m.failure_rate == 0.5"
          hint: "4 failed out of 8 total = 0.5. round(4/8, 2) = 0.5"

  - id: py-013-defensive
    chapter: "4. Reliability"
    title: "Defensive Coding"
    summary: "Validate inputs early so errors are obvious, not mysterious."
    outcome: "You will write a safe average function that gives clear errors instead of confusing crashes."
    body_markdown: |
      A function that silently returns a wrong answer is more dangerous than one that crashes loudly.

      **Guard clauses** check preconditions at the top of a function and return (or raise) early:
      ```python
      def safe_divide(a, b):
          if b == 0:
              return None       # or raise ValueError("b cannot be zero")
          return a / b
      ```

      **Raising exceptions** — signal that something is genuinely wrong:
      ```python
      def compute_mean(values):
          if not isinstance(values, list):
              raise TypeError(f"Expected list, got {type(values).__name__}")
          if len(values) == 0:
              raise ValueError("Cannot compute mean of an empty list")
          return sum(values) / len(values)
      ```

      **`isinstance`** checks whether a value has the expected type:
      ```python
      isinstance(42, int)        # True
      isinstance("hello", str)   # True
      isinstance(3.14, (int, float))  # True — checks against either type
      ```

      **The rule:** validate at boundaries (where data enters your system) and trust validated data inside.
      Do not add guards everywhere — only where bad input is realistic.
    example_code: |
      def safe_max(values, default=None):
          if not isinstance(values, list):
              return default
          numeric = [v for v in values if isinstance(v, (int, float))]
          if not numeric:
              return default
          return max(numeric)

      print(safe_max([3, 1, 4, 1, 5]))   # 5
      print(safe_max([]))                  # None
      print(safe_max(["bad", None, 7]))   # 7
    hints:
      - "First check: `if not isinstance(values, list): raise TypeError(...)`. Second check: empty list raises ValueError."
      - "Filter non-numeric values: `numeric = [v for v in values if isinstance(v, (int, float))]`. Then compute sum/len."
      - "`result['mean']` = sum/len, `result['count']` = count of valid numbers, `result['skipped']` = len(values) - count."
    exercise:
      prompt: |
        Write a function `safe_stats(values)` that:

        1. Raises `TypeError` with message `"values must be a list"` if `values` is not a list
        2. Filters out any items that are not `int` or `float`
        3. Raises `ValueError` with message `"no numeric values"` if nothing remains after filtering
        4. Returns a dictionary with keys `"mean"`, `"count"`, and `"skipped"`:
           - `"mean"` — the average of numeric values, rounded to 2 decimal places
           - `"count"` — how many numeric values there were
           - `"skipped"` — how many non-numeric values were filtered out

        Store:
        - `result = safe_stats([10, "bad", 20, None, 30])`

        Print `result`.
      starter_code: |
        def safe_stats(values):
            return {}


        result = safe_stats([10, "bad", 20, None, 30])
        print(result)
      success_message: "You wrote a defensive, self-documenting function. This is production-quality Python."
      tests:
        - name: "safe_stats returns correct mean"
          assertion: "assert m.safe_stats([10, 'bad', 20, None, 30])['mean'] == 20.0"
          hint: "Mean of [10, 20, 30] = 20.0"
        - name: "safe_stats returns correct count and skipped"
          assertion: "assert m.safe_stats([10, 'bad', 20, None, 30])['count'] == 3 and m.safe_stats([10, 'bad', 20, None, 30])['skipped'] == 2"
          hint: "3 numeric values, 2 non-numeric ('bad' and None)"
        - name: "safe_stats raises TypeError for non-list"
          assertion: |
            try:
                m.safe_stats("not a list")
                assert False, "Should have raised TypeError"
            except TypeError:
                pass
          hint: "Check isinstance(values, list) at the top and raise TypeError if it fails."
        - name: "safe_stats raises ValueError for empty numeric list"
          assertion: |
            try:
                m.safe_stats(["a", "b"])
                assert False, "Should have raised ValueError"
            except ValueError:
                pass
          hint: "After filtering, if numeric list is empty, raise ValueError."
        - name: "result has correct values"
          assertion: "assert m.result == {'mean': 20.0, 'count': 3, 'skipped': 2}"
          hint: "result = safe_stats([10, 'bad', 20, None, 30]) should return {'mean': 20.0, 'count': 3, 'skipped': 2}"
