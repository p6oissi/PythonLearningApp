  - id: py-009-functions
    chapter: "2. Program Flow"
    title: "Functions"
    summary: "Package reusable logic into named, testable units."
    outcome: "You will write two reusable preprocessing functions and call them on real data."
    body_markdown: |
      A **function** wraps a piece of logic behind a name so you can use it many times
      without rewriting it:

      ```python
      def double(x):
          return x * 2

      result = double(5)   # 10
      ```

      **Anatomy of a function:**
      - `def` — keyword that starts a function definition
      - `double` — the function's name
      - `x` — a parameter (placeholder for the input)
      - `return` — sends a value back to the caller
      - Call it by writing `double(5)` — `5` is the **argument**

      **Multiple parameters:**
      ```python
      def clamp(value, min_val, max_val):
          if value < min_val:
              return min_val
          if value > max_val:
              return max_val
          return value
      ```

      **Default parameter values:**
      ```python
      def normalize(score, max_score=100):
          if max_score == 0:
              return 0
          return score / max_score
      ```

      Functions are the building blocks of data pipelines:
      `load_data()` → `clean()` → `normalize()` → `train()` → `evaluate()`
    example_code: |
      def celsius_to_fahrenheit(c):
          return (c * 9 / 5) + 32

      def is_fever(temp_celsius, threshold=37.5):
          return temp_celsius >= threshold

      readings = [36.8, 38.2, 37.1, 39.0]
      for t in readings:
          f = celsius_to_fahrenheit(t)
          fever = is_fever(t)
          print(f"{t}°C = {round(f, 1)}°F — fever: {fever}")
    hints:
      - "Define with `def normalize_score(score, max_score):`. Inside, check if max_score is 0 first."
      - "For normalize_score: `if max_score == 0: return 0` then `return score / max_score`."
      - "For classify_score: use if/elif/else inside the function and `return` the label string."
    exercise:
      prompt: |
        Write two functions:

        **`normalize_score(score, max_score)`**
        - Returns `score / max_score`
        - If `max_score` is `0`, returns `0` to avoid a division error

        **`classify_score(score)`**
        - Returns `"excellent"` if score >= 0.90
        - Returns `"good"` if score >= 0.75
        - Returns `"fair"` if score >= 0.60
        - Returns `"poor"` otherwise

        Then call both functions and store results:
        - `normalized = normalize_score(45, 50)`
        - `label = classify_score(normalized)`

        Print both.
      starter_code: |
        def normalize_score(score, max_score):
            return None


        def classify_score(score):
            return None


        normalized = normalize_score(45, 50)
        label = classify_score(normalized)

        print(normalized, label)
      success_message: "Two reusable functions that work together — this is how real ML pipelines are structured."
      tests:
        - name: "normalize_score returns correct ratio"
          assertion: "assert m.normalize_score(45, 50) == 0.9"
          hint: "return score / max_score"
        - name: "normalize_score handles zero max"
          assertion: "assert m.normalize_score(10, 0) == 0"
          hint: "Check if max_score == 0 before dividing and return 0."
        - name: "classify_score returns correct labels"
          assertion: "assert m.classify_score(0.95) == 'excellent' and m.classify_score(0.80) == 'good' and m.classify_score(0.50) == 'poor'"
          hint: "Use if/elif/else with the thresholds 0.90, 0.75, 0.60."
        - name: "normalized and label are correct"
          assertion: "assert m.normalized == 0.9 and m.label == 'excellent'"
          hint: "normalize_score(45, 50) = 0.9, classify_score(0.9) = 'excellent'"

