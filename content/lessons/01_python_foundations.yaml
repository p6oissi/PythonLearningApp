lessons:

  # ─── Chapter 1: Python Basics ───────────────────────────────────────────────

  - id: py-001-values-variables
    chapter: "1. Python Basics"
    title: "Values and Variables"
    summary: "Give names to data so you can reuse and describe it."
    outcome: "You will create variables for a small dataset description and print a readable summary."
    body_markdown: |
      A **value** is any piece of information: a name, a number, a yes/no flag.

      A **variable** is a label you attach to a value so you can refer to it later.
      Think of it like a sticky note on a box — the note says what is inside.

      ```
      dataset_name = "customer survey"
      ```

      The `=` sign means "store this value under this name". It is not asking a question —
      it is making an assignment.

      Variable names should be descriptive. In data work, vague names like `x` or `d` make
      code impossible to understand a week later.

      Three types you will use most:
      - **`str`** (text) — always inside quotes: `"hello"`
      - **`int`** (whole number) — no quotes: `42`
      - **`bool`** (true/false) — `True` or `False`, capital first letter

      An **f-string** lets you combine variables into a sentence:
      ```python
      name = "Ada"
      count = 120
      print(f"Dataset: {name}, rows: {count}")
      ```
    example_code: |
      dataset_name = "training scores"
      row_count = 120
      has_missing_values = True

      summary = f"{dataset_name}: {row_count} rows, needs cleaning: {has_missing_values}"
      print(summary)
    hints:
      - "A variable is created with `name = value`. Make sure the string uses quotes and the number does not."
      - "For the summary, use an f-string: `summary = f\"...{dataset_name}...{row_count}...\"`"
      - "The tests check exact values: `dataset_name` must equal `\"customer survey\"` and `row_count` must equal `48`."
    exercise:
      prompt: |
        Create these four variables:

        - `dataset_name` with the value `"customer survey"`
        - `row_count` with the value `48`
        - `has_missing_values` with the value `True`
        - `summary` — an f-string sentence that mentions both the dataset name and the row count

        Print `summary`.
      starter_code: |
        dataset_name = ""
        row_count = 0
        has_missing_values = False
        summary = ""

        print(summary)
      success_message: "You created your first reusable data summary. Variables are the building blocks of every program."
      tests:
        - name: "dataset_name is correct"
          assertion: "assert m.dataset_name == 'customer survey'"
          hint: "Use the exact text: customer survey (no capital letters)"
        - name: "row_count is correct"
          assertion: "assert m.row_count == 48"
          hint: "Use an integer (no quotes around the number)."
        - name: "has_missing_values is True"
          assertion: "assert m.has_missing_values is True"
          hint: "Python booleans are True and False — capital first letter, no quotes."
        - name: "summary contains name and row count"
          assertion: "assert 'customer survey' in m.summary and '48' in m.summary"
          hint: "Your f-string should include both {dataset_name} and {row_count}."

  - id: py-002-numbers-math
    chapter: "1. Python Basics"
    title: "Numbers and Math"
    summary: "Do calculations and compare values — the core of every data analysis."
    outcome: "You will compute a percentage score, round it, and check whether it is a passing grade."
    body_markdown: |
      Python has two number types:
      - **`int`** — whole numbers: `5`, `100`, `-3`
      - **`float`** — decimal numbers: `3.14`, `0.9`, `-1.5`

      **Arithmetic operators:**

      | Operator | Meaning | Example | Result |
      |---|---|---|---|
      | `+` | add | `3 + 2` | `5` |
      | `-` | subtract | `10 - 4` | `6` |
      | `*` | multiply | `3 * 4` | `12` |
      | `/` | divide (always float) | `7 / 2` | `3.5` |
      | `//` | floor divide (whole) | `7 // 2` | `3` |
      | `%` | remainder | `7 % 2` | `1` |
      | `**` | power | `2 ** 3` | `8` |

      **Comparison operators** return `True` or `False`:
      `==`, `!=`, `<`, `>`, `<=`, `>=`

      **Useful built-ins:**
      - `round(3.14159, 2)` → `3.14`
      - `abs(-5)` → `5`
      - `int(3.9)` → `3` (truncates, does not round)
    example_code: |
      correct = 17
      total = 20
      score_pct = (correct / total) * 100
      score_rounded = round(score_pct, 1)
      passed = score_pct >= 70

      print(f"Score: {score_rounded}%")
      print(f"Passed: {passed}")
    hints:
      - "Percentage is `(score / max_score) * 100`. Use `/` for division, `*` for multiplication."
      - "Use `round(value, 2)` to round to 2 decimal places. Use `>= 60` to check if passing."
      - "`is_passing` should be a boolean: `is_passing = percentage >= 60`"
    exercise:
      prompt: |
        A student answered `42` questions correctly out of `70` total.

        Create:
        - `score` set to `42`
        - `max_score` set to `70`
        - `percentage` — the score as a percentage (score divided by max_score, times 100)
        - `percentage_rounded` — rounded to 2 decimal places
        - `is_passing` — `True` if percentage is 60 or above, otherwise `False`

        Print all five values.
      starter_code: |
        score = 0
        max_score = 0
        percentage = 0
        percentage_rounded = 0
        is_passing = False

        print(score, max_score, percentage, percentage_rounded, is_passing)
      success_message: "Excellent! You computed a real grade. These same steps appear in model accuracy calculations."
      tests:
        - name: "score and max_score are set"
          assertion: "assert m.score == 42 and m.max_score == 70"
          hint: "Set score = 42 and max_score = 70."
        - name: "percentage is calculated correctly"
          assertion: "assert abs(m.percentage - 60.0) < 0.01"
          hint: "percentage = (score / max_score) * 100 — result should be 60.0"
        - name: "percentage_rounded has 2 decimal places"
          assertion: "assert m.percentage_rounded == 60.0"
          hint: "Use round(percentage, 2)"
        - name: "is_passing is True"
          assertion: "assert m.is_passing is True"
          hint: "60 >= 60 is True. Use >= not >"

  - id: py-003-strings
    chapter: "1. Python Basics"
    title: "Working with Text"
    summary: "Clean and transform text — a daily task in real data work."
    outcome: "You will normalize a messy column name from a raw dataset into a clean, usable format."
    body_markdown: |
      In data work, text (strings) is everywhere: column names, categories, labels, notes.
      Real data is rarely clean — it has extra spaces, inconsistent capitalisation, odd characters.

      **Creating strings:**
      ```python
      name = "Ada Lovelace"
      empty = ""
      ```

      **Essential string methods** (they return a new string, not modify in place):

      | Method | What it does | Example |
      |---|---|---|
      | `.strip()` | remove leading/trailing whitespace | `"  hi  ".strip()` → `"hi"` |
      | `.lower()` | lowercase everything | `"Ada".lower()` → `"ada"` |
      | `.upper()` | uppercase everything | `"ada".upper()` → `"ADA"` |
      | `.replace(a, b)` | swap every `a` for `b` | `"a b".replace(" ", "_")` → `"a_b"` |
      | `.split(sep)` | cut into a list | `"a,b,c".split(",")` → `["a","b","c"]` |

      **Other useful tools:**
      - `len("hello")` → `5`
      - `"data" in "big data"` → `True`
      - `"Ada"[0]` → `"A"` (indexing — first character is 0)
      - `"Ada"[-1]` → `"a"` (last character)

      Chaining methods:
      ```python
      raw = "  Blood Pressure  "
      clean = raw.strip().lower().replace(" ", "_")
      # → "blood_pressure"
      ```
    example_code: |
      raw_column = "  Age (Years)  "
      clean_column = raw_column.strip().lower().replace(" ", "_").replace("(", "").replace(")", "")
      print(clean_column)   # age_years
      print(len(clean_column))
    hints:
      - "Chain methods one after another: `raw.strip().lower()...` — each method returns a new string you can call the next method on."
      - "Replace spaces with underscores: `.replace(' ', '_')`. Then remove parentheses: `.replace('(', '').replace(')', '')`."
      - "The word count needs `.split()` which splits on whitespace by default. `len('hello world'.split())` is 2."
    exercise:
      prompt: |
        You receive a messy column name from a spreadsheet: `"  Total Score (%) "`.

        Create:
        - `raw` set to `"  Total Score (%) "`
        - `cleaned` — strip whitespace, lowercase, replace spaces with underscores, remove `(`, `)`, and `%`
        - `word_count` — the number of words in `raw` after stripping (use `.split()`)
        - `starts_with_t` — `True` if `cleaned` starts with the letter `"t"`

        Print all four values.
      starter_code: |
        raw = "  Total Score (%) "
        cleaned = ""
        word_count = 0
        starts_with_t = False

        print(raw, cleaned, word_count, starts_with_t)
      success_message: "You cleaned your first messy column name. This exact pattern appears in every real data pipeline."
      tests:
        - name: "cleaned is correct"
          assertion: "assert m.cleaned == 'total_score_'"
          hint: "Chain: .strip().lower().replace(' ', '_').replace('(', '').replace(')', '').replace('%', '')"
        - name: "word_count is correct"
          assertion: "assert m.word_count == 3"
          hint: "After stripping, 'Total Score (%)' has 3 words. Use len(raw.strip().split())"
        - name: "starts_with_t is True"
          assertion: "assert m.starts_with_t is True"
          hint: "cleaned[0] == 't' or cleaned.startswith('t') — both work"

  - id: py-004-lists
    chapter: "1. Python Basics"
    title: "Lists"
    summary: "Store ordered collections of values — like a column of data."
    outcome: "You will build a list of measurements and compute basic facts about it."
    body_markdown: |
      A **list** holds multiple values in order, inside square brackets:
      ```python
      scores = [72, 85, 91, 68, 79]
      ```

      Think of it like a column in a spreadsheet — each row has a position (index).

      **Indexing** — accessing individual items:
      ```python
      scores[0]   # 72  (first item — indexing starts at 0)
      scores[-1]  # 79  (last item)
      scores[1:3] # [85, 91]  (slice: items 1 and 2, not 3)
      ```

      **Useful operations:**

      | Code | Result |
      |---|---|
      | `len(scores)` | number of items |
      | `sum(scores)` | total |
      | `min(scores)` | smallest value |
      | `max(scores)` | largest value |
      | `scores.append(95)` | add 95 to the end |
      | `95 in scores` | True/False membership check |

      Lists can hold any type, but in data work each list usually holds one type (all numbers, all strings).
    example_code: |
      temperatures = [22.1, 19.8, 24.5, 21.0, 23.3]

      count = len(temperatures)
      total = sum(temperatures)
      average = total / count
      hottest = max(temperatures)

      print(f"Readings: {count}, Average: {round(average, 1)}°C, Peak: {hottest}°C")
    hints:
      - "Create a list with square brackets: `measurements = [1.2, 3.4, ...]`. Use `len()`, `sum()`, `min()`, `max()` directly on it."
      - "Average = sum / count. `range_val = max(...) - min(...)` gives the spread."
      - "To get the second value use index `[1]`. To check membership: `1.2 in measurements` returns True or False."
    exercise:
      prompt: |
        You have blood pressure readings (in mmHg): `120, 135, 118, 142, 129`.

        Create:
        - `measurements` — a list of those five numbers
        - `count` — how many readings
        - `total` — sum of all readings
        - `average` — total divided by count, rounded to 1 decimal place
        - `highest` — the maximum reading
        - `lowest` — the minimum reading
        - `range_val` — highest minus lowest

        Print all values.
      starter_code: |
        measurements = []
        count = 0
        total = 0
        average = 0
        highest = 0
        lowest = 0
        range_val = 0

        print(measurements, count, total, average, highest, lowest, range_val)
      success_message: "You summarised a dataset with six statistics. This is exactly what exploratory data analysis looks like."
      tests:
        - name: "measurements has 5 correct values"
          assertion: "assert m.measurements == [120, 135, 118, 142, 129]"
          hint: "List items are separated by commas inside square brackets."
        - name: "count is 5"
          assertion: "assert m.count == 5"
          hint: "Use len(measurements)"
        - name: "total is correct"
          assertion: "assert m.total == 644"
          hint: "Use sum(measurements)"
        - name: "average is rounded correctly"
          assertion: "assert m.average == 128.8"
          hint: "average = round(total / count, 1)"
        - name: "highest and lowest are correct"
          assertion: "assert m.highest == 142 and m.lowest == 118"
          hint: "Use max(measurements) and min(measurements)"
        - name: "range_val is correct"
          assertion: "assert m.range_val == 24"
          hint: "range_val = highest - lowest"

  - id: py-005-dicts
    chapter: "1. Python Basics"
    title: "Dictionaries"
    summary: "Store one record as key-value pairs — like a single row of data."
    outcome: "You will represent a data record as a dictionary and access its fields."
    body_markdown: |
      A **dictionary** stores pairs of keys and values, inside curly braces:
      ```python
      patient = {
          "name": "Ada",
          "age": 34,
          "diabetic": False,
      }
      ```

      Think of it like one row in a spreadsheet where each column has a name (key).

      **Accessing values:**
      ```python
      patient["name"]         # "Ada"  — raises error if key missing
      patient.get("weight")   # None   — safe, returns None if missing
      patient.get("age", 0)   # 34     — returns default if missing
      ```

      **Modifying:**
      ```python
      patient["age"] = 35              # update existing key
      patient["weight_kg"] = 68.5      # add new key
      del patient["diabetic"]          # remove a key
      ```

      **Looping over a dict:**
      ```python
      for key, value in patient.items():
          print(key, "→", value)
      ```

      **Other useful methods:**
      - `patient.keys()` — all keys
      - `patient.values()` — all values
      - `"age" in patient` — True/False check
    example_code: |
      sensor_reading = {
          "sensor_id": "T-01",
          "value": 98.6,
          "unit": "fahrenheit",
          "valid": True,
      }

      celsius = (sensor_reading["value"] - 32) * 5 / 9
      sensor_reading["celsius"] = round(celsius, 1)

      print(sensor_reading["sensor_id"], "→", sensor_reading["celsius"], "°C")
    hints:
      - "Create the dict with `feature = {'name': ..., 'count': ..., ...}`. Each key is a string in quotes."
      - "To add or update a key: `feature['mean'] = total / count`. You can compute the mean from your lists."
      - "Use `feature.get('category', 'unknown')` to safely access a key that might not exist."
    exercise:
      prompt: |
        You are describing a dataset feature (column).

        Create a dictionary called `feature` with these keys:
        - `"name"` → `"age"`
        - `"count"` → `100`
        - `"missing"` → `3`
        - `"mean"` → `42.7`
        - `"is_numeric"` → `True`

        Then add a new key `"missing_pct"` whose value is `missing / count * 100`, rounded to 1 decimal.

        Print the dictionary and then print `feature["missing_pct"]`.
      starter_code: |
        feature = {}

        # Add missing_pct here

        print(feature)
        print(feature["missing_pct"])
      success_message: "You built a feature metadata record. Data scientists store exactly this kind of information about every column."
      tests:
        - name: "feature has all required keys"
          assertion: "assert all(k in m.feature for k in ['name','count','missing','mean','is_numeric'])"
          hint: "Make sure you include all five keys with the exact names shown."
        - name: "core values are correct"
          assertion: "assert m.feature['name'] == 'age' and m.feature['count'] == 100 and m.feature['is_numeric'] is True"
          hint: "Check spelling and types: is_numeric should be True (boolean), not 'True' (string)."
        - name: "missing_pct is calculated correctly"
          assertion: "assert m.feature['missing_pct'] == 3.0"
          hint: "missing_pct = round(3 / 100 * 100, 1) = 3.0"

  # ─── Chapter 2: Program Flow ─────────────────────────────────────────────────

  - id: py-006-conditions
    chapter: "2. Program Flow"
    title: "Conditions"
    summary: "Make decisions in code — classify values based on rules."
    outcome: "You will write a score classifier that labels data points into quality categories."
    body_markdown: |
      A program that always does the same thing regardless of input is not very useful.
      **Conditions** let code take different paths based on data.

      ```python
      if score >= 90:
          label = "excellent"
      elif score >= 70:
          label = "good"
      elif score >= 50:
          label = "needs work"
      else:
          label = "failing"
      ```

      **Important:**
      - Indentation (4 spaces) is how Python knows what belongs inside each branch
      - `elif` means "else if" — checked only when the previous condition was False
      - `else` is the catch-all — runs when nothing above matched

      **Combining conditions:**
      ```python
      if score >= 0 and score <= 100:   # both must be True
          ...
      if score < 0 or score > 100:      # at least one must be True
          ...
      if not is_valid:                   # flip True/False
          ...
      ```

      **Common mistakes:**
      - `=` assigns a value; `==` compares two values
      - Missing the colon `:` at the end of `if`/`elif`/`else`
    example_code: |
      temperature = 38.5  # body temperature in Celsius

      if temperature >= 39.5:
          status = "high fever"
      elif temperature >= 38.0:
          status = "mild fever"
      elif temperature >= 36.0:
          status = "normal"
      else:
          status = "below normal"

      print(f"{temperature}°C → {status}")
    hints:
      - "Start with `if score >= 90:` and work down. Each branch must have a colon and indented body."
      - "Use `elif` for the middle categories, `else` for the catch-all. Check order matters — higher thresholds first."
      - "For the valid check: `is_valid = score >= 0 and score <= 100`. Use `and` to require both conditions."
    exercise:
      prompt: |
        Classify a model's accuracy score into a quality label.

        Given `score = 0.76`, write conditions to set:
        - `label`:
          - `"excellent"` if score >= 0.90
          - `"good"` if score >= 0.75
          - `"fair"` if score >= 0.60
          - `"poor"` otherwise
        - `is_valid` — `True` if score is between 0.0 and 1.0 (inclusive), `False` otherwise

        Print both values.
      starter_code: |
        score = 0.76
        label = ""
        is_valid = False

        # Write your conditions here

        print(label, is_valid)
      success_message: "You wrote a classifier. Machine learning pipelines use exactly this logic to bucket predictions."
      tests:
        - name: "label is 'good'"
          assertion: "assert m.label == 'good'"
          hint: "0.76 >= 0.75 but < 0.90, so it should be 'good'."
        - name: "is_valid is True"
          assertion: "assert m.is_valid is True"
          hint: "0.76 is between 0 and 1, so is_valid = True. Use `score >= 0 and score <= 1`."

  - id: py-007-for-loops
    chapter: "2. Program Flow"
    title: "For Loops"
    summary: "Repeat an action for every item in a list — the core of data processing."
    outcome: "You will clean a column of raw values and compute a count and total in one pass."
    body_markdown: |
      A **for loop** runs the same code once for each item in a list:
      ```python
      for value in scores:
          print(value)
      ```

      This is the fundamental pattern of data processing: visit every record, decide what to do with it.

      **The accumulator pattern** — building a result as you go:
      ```python
      total = 0
      for value in scores:
          total = total + value   # same as: total += value
      ```

      **Filtering while looping:**
      ```python
      clean = []
      for value in scores:
          if value is not None and value >= 0:
              clean.append(value)
      ```

      **`enumerate`** gives you the index too:
      ```python
      for index, value in enumerate(scores):
          print(f"Row {index}: {value}")
      ```

      **`range`** generates numbers:
      ```python
      for i in range(5):      # 0, 1, 2, 3, 4
          print(i)
      for i in range(2, 8):   # 2, 3, 4, 5, 6, 7
          print(i)
      ```
    example_code: |
      raw_temps = [36.8, None, 37.2, -99, 38.1, 36.5, None]

      valid_temps = []
      skipped = 0

      for temp in raw_temps:
          if temp is not None and temp > 0:
              valid_temps.append(temp)
          else:
              skipped += 1

      print(f"Valid: {valid_temps}")
      print(f"Skipped: {skipped}, Total valid: {len(valid_temps)}")
    hints:
      - "Use two lists: one for valid values and one for (or just a counter for) invalid ones. Build them inside a for loop."
      - "A value is valid if it is not None AND it is greater than 0. Use `if value is not None and value > 0:`"
      - "After the loop, `valid_total = sum(valid_values)` and `valid_count = len(valid_values)`."
    exercise:
      prompt: |
        You have a column of raw sensor readings that may contain `None` or negative values.

        ```python
        raw_values = [5.2, None, 8.1, -1.0, 7.4, None, 6.9, -0.5, 9.0]
        ```

        Using a for loop, create:
        - `valid_values` — list of values that are not `None` and greater than `0`
        - `invalid_count` — how many values were skipped
        - `valid_total` — sum of all valid values (rounded to 1 decimal)
        - `valid_count` — number of valid values

        Print all four.
      starter_code: |
        raw_values = [5.2, None, 8.1, -1.0, 7.4, None, 6.9, -0.5, 9.0]

        valid_values = []
        invalid_count = 0
        valid_total = 0
        valid_count = 0

        # Write your loop here

        print(valid_values, invalid_count, valid_total, valid_count)
      success_message: "You built a data cleaning pass. Every preprocessing pipeline starts with a loop exactly like this."
      tests:
        - name: "valid_values contains the right items"
          assertion: "assert m.valid_values == [5.2, 8.1, 7.4, 6.9, 9.0]"
          hint: "Keep values that are not None AND greater than 0. -1.0 and -0.5 should be excluded."
        - name: "invalid_count is correct"
          assertion: "assert m.invalid_count == 4"
          hint: "Two Nones + two negatives = 4 skipped values."
        - name: "valid_total is correct"
          assertion: "assert m.valid_total == 37.6"
          hint: "Sum the valid list and round to 1 decimal: round(sum(valid_values), 1)"
        - name: "valid_count is correct"
          assertion: "assert m.valid_count == 5"
          hint: "valid_count = len(valid_values)"

  - id: py-008-while-loops
    chapter: "2. Program Flow"
    title: "While Loops"
    summary: "Repeat until a condition is met — useful for search and retry patterns."
    outcome: "You will scan a list to find the first value above a threshold and track how many steps it took."
    body_markdown: |
      A **while loop** keeps running as long as a condition is True:
      ```python
      count = 0
      while count < 5:
          print(count)
          count += 1
      ```

      Use a while loop when you do not know in advance how many times you need to loop.
      A for loop is better when you know the collection.

      **`break`** — exit the loop immediately:
      ```python
      for value in data:
          if value > threshold:
              break   # stop as soon as we find one
      ```

      **`break` with an index counter:**
      ```python
      i = 0
      while i < len(data):
          if data[i] > threshold:
              break
          i += 1
      # After break: i is the index of the first match (or len(data) if not found)
      ```

      **Caution:** Always make sure a while loop can eventually stop.
      A loop with a condition that never becomes False will run forever and freeze your program.
    example_code: |
      readings = [0.3, 0.5, 0.4, 0.8, 0.7, 0.95, 0.6]
      threshold = 0.85

      steps = 0
      found_value = None

      for reading in readings:
          steps += 1
          if reading >= threshold:
              found_value = reading
              break

      if found_value is not None:
          print(f"Found {found_value} after {steps} step(s)")
      else:
          print("No value above threshold")
    hints:
      - "Use a for loop with a counter: `steps = 0`. Inside the loop, `steps += 1` and check if the value meets the condition."
      - "Use `break` to stop the loop as soon as you find the value. Set `first_above` before breaking."
      - "If the loop finishes without breaking, `first_above` stays `None`. Check `if first_above is None:` to set `found` to False."
    exercise:
      prompt: |
        You are scanning a list of model confidence scores to find the first one above 0.80.

        ```python
        confidences = [0.55, 0.62, 0.71, 0.68, 0.84, 0.79, 0.91]
        threshold = 0.80
        ```

        Create:
        - `first_above` — the first confidence value above the threshold (or `None` if none found)
        - `steps_taken` — how many values were checked before finding it (including the match)
        - `found` — `True` if a value was found, `False` otherwise

        Print all three.
      starter_code: |
        confidences = [0.55, 0.62, 0.71, 0.68, 0.84, 0.79, 0.91]
        threshold = 0.80

        first_above = None
        steps_taken = 0
        found = False

        # Write your loop here

        print(first_above, steps_taken, found)
      success_message: "You implemented a linear scan. This is the basis for early-stopping and threshold search in ML."
      tests:
        - name: "first_above is correct"
          assertion: "assert m.first_above == 0.84"
          hint: "0.84 is the first value greater than 0.80 in the list."
        - name: "steps_taken is correct"
          assertion: "assert m.steps_taken == 5"
          hint: "Count each value checked including the matching one: 0.55, 0.62, 0.71, 0.68, 0.84 = 5 steps."
